documentation_task:
  description: >-
    Проанализируй этот VBA-код и напиши техническую документацию на русском языке (что делает функция, какие объекты использует):

    {vba_code}
  expected_output: >-
    Структурированное техническое описание кода.
  agent: technical_writer

audit_task:
  description: >-
    Изучи техническое описание из предыдущей задачи и сам исходный код. Найди критические баги и напиши рекомендации по исправлению на русском языке.
  expected_output: >-
    Список найденных багов, уязвимостей и код исправлений.
  agent: security_engineer
